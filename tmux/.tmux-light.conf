# Light status fragment — sourced by .tmux.conf when ~/.config/cfg-theme == light.
# Solarized Light: matches alacritty light base (bg #fdf6e3 / fg #586e75).
# bg=default lets the outer terminal's warm paper background show through.
set -g status-style "fg=#586e75,bg=default"
set -g status-left-style "fg=#93a1a1,bg=default"
set -g status-right-style "fg=#93a1a1,bg=default"
setw -g window-status-style "fg=#93a1a1,bg=default"
setw -g window-status-current-style "fg=#073642,bold,bg=default"
set -g message-style "fg=#fdf6e3,bg=#586e75"
set -g pane-border-style "fg=#c8c4b8"
set -g pane-active-border-style "fg=#586e75"