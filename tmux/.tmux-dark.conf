# Dark status fragment — sourced by .tmux.conf when ~/.config/cfg-theme != light.
# Soft neutral-gray: matches alacritty dark base (bg #1e1e1e / fg #d4d4d4).
# bg=default lets the outer terminal's soft-black background show through.
set -g status-style "fg=#d4d4d4,bg=default"
set -g status-left-style "fg=#9a9a9a,bg=default"
set -g status-right-style "fg=#9a9a9a,bg=default"
setw -g window-status-style "fg=#9a9a9a,bg=default"
setw -g window-status-current-style "fg=#d4d4d4,bold,bg=default"
set -g message-style "fg=#d4d4d4,bg=#1e1e1e"
set -g pane-border-style "fg=#3a3a3a"
set -g pane-active-border-style "fg=#7a7a7a"