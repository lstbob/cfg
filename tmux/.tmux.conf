set -g mouse on
set -g mode-keys vi

set -g default-shell /usr/bin/zsh

# True color (24-bit) passthrough so Neovim/rose-pine renders its full palette
# instead of being downsampled to 256 colors. ',*:RGB' applies to any outer terminal.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# vim-style selection: v = visual, Ctrl+v = visual block (like vim)
bind-key -T copy-mode-vi v     send-keys -X begin-selection
bind-key -T copy-mode-vi C-v   send-keys -X begin-selection \; send-keys -X rectangle-toggle

# copy-mode yank -> system clipboard (OS-aware: clip.exe on WSL, xclip on Linux)
# Ctrl+C and Ctrl+V enabled in copy mode for intuitive copy/paste.
if-shell 'grep -qi microsoft /proc/version' \
  'bind-key -T copy-mode-vi y        send-keys -X copy-pipe-and-cancel "clip.exe"; bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "clip.exe"; bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clip.exe"; bind-key -T copy-mode-vi C-c send-keys -X copy-pipe-and-cancel "clip.exe"; bind-key -T prefix C-v run "clip.exe -o | tmux load-buffer - && tmux paste-buffer"' \
  'bind-key -T copy-mode-vi y        send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"; bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"; bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"; bind-key -T copy-mode-vi C-c send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"; bind-key -T prefix C-v run "xclip -o -selection clipboard | tmux load-buffer - && tmux paste-buffer"'

# Remap prefix from Ctrl+b to Alt+Space
unbind C-b
set -g prefix M-Space
bind M-Space send-prefix

setw -g pane-base-index 1
set -g base-index 1

set -g window-style 'bg=default'
set -g window-active-style 'bg=default'

# tmux-resurrect: persist/restore tmux sessions across reboots.
# Restore Neovim too: on restore, if a pane that was running nvim has a
# Session.vim in its dir, resurrect relaunches `nvim -S Session.vim`
# (reopening your files); otherwise it just starts plain nvim.
set -g @resurrect-strategy-nvim 'session'

run-shell ~/.local/share/tmux/plugins/tmux-resurrect/resurrect.tmux

# rose-pine theme (options must come before the run-shell that reads them)
set -g @rose_pine_variant 'main'                   # main | moon | dawn
set -g @rose_pine_bar_bg_disable 'on'              # transparent status bar
set -g @rose_pine_bar_bg_disabled_color_option 'default'

run-shell ~/.local/share/tmux/plugins/tmux-rose-pine/rose-pine.tmux
