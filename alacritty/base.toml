# Shared Alacritty base config — used by both native Linux and Windows/WSL.
# Contains NO [keyboard] bindings and NO theme import, so it never conflicts
# with the OS-specific bindings file and never goes stale against the theme.
# The generated top-level alacritty.toml imports this + the OS bindings.
#
# Minimal white-on-black: opaque pure-black background, white base foreground.
# The 16-color ANSI palette is left at Alacritty defaults so fzf / nvim syntax
# highlighting / zsh-syntax-highlighting validity feedback all keep working.

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }
size = 11

[cursor]
style = { shape = "Block", blinking = "Always" }
blink_interval = 300

[window]
startup_mode = "Fullscreen"
opacity = 1.0

[colors.primary]
background = "#000000"
foreground = "#ffffff"