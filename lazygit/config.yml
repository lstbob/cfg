# Minimal soft-gray theme. Off-white text on the terminal's near-black background
# (alacritty bg #1e1e1e / fg #d4d4d4); selected/highlighted lines use a dim grey
# so they stay visible without harsh pure-white contrast.
gui:
  theme:
    activeBorderColor:
      - "#d4d4d4"
      - bold
    inactiveBorderColor:
      - "#9a9a9a"
    searchingActiveBorderColor:
      - "#d4d4d4"
      - bold
    optionsTextColor:
      - "#9a9a9a"
    selectedLineBgColor:
      - "#333333"
    cherryPickedCommitBgColor:
      - "#333333"
    cherryPickedCommitFgColor:
      - "#d4d4d4"
    unstagedChangesColor:
      - "#d4d4d4"
    defaultFgColor:
      - "#d4d4d4"
    searchingActiveColor:
      - "#d4d4d4"