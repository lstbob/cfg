# Minimal white-on-black theme. All text is white on the terminal's black
# background; selected/highlighted lines use a dim grey so they stay visible.
gui:
  theme:
    activeBorderColor:
      - "#ffffff"
      - bold
    inactiveBorderColor:
      - "#ffffff"
    searchingActiveBorderColor:
      - "#ffffff"
      - bold
    optionsTextColor:
      - "#ffffff"
    selectedLineBgColor:
      - "#333333"
    cherryPickedCommitBgColor:
      - "#333333"
    cherryPickedCommitFgColor:
      - "#ffffff"
    unstagedChangesColor:
      - "#ffffff"
    defaultFgColor:
      - "#ffffff"
    searchingActiveColor:
      - "#ffffff"